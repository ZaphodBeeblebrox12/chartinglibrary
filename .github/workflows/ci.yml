name: TradeThesis Charts CI

on:
  push:
    branches:
      - main
      - feat/tradethesis-charts-app
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1

      - name: Bootstrap and commit lockfile once when missing on a PR
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
            cp package-lock.json /tmp/tradethesis-package-lock.json
            git fetch origin "$PR_BRANCH"
            git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"
            cp /tmp/tradethesis-package-lock.json package-lock.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm workspace lockfile"
            git push origin "$PR_BRANCH"
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check, unit test and build
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
