name: TradeThesis Charts CI

on:
  push:
    branches:
      - main
      - feat/tradethesis-charts-app
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1

      - name: Generate npm lockfile for initial bootstrap
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Upload generated lockfile for repository bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: tradethesis-charts-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2

      - name: Type-check, unit test and build
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
